# All the containers to run.
services:
  api:
    build:
      context: './services/app'
      dockerfile: 'Dockerfile'
      target: 'server'

    container_name: 'api'

    ports:
      - '${PUSH_NOTIFICATIONS_API_PORT:-}:8080'

    environment:
      - 'VAPID__EMAIL_ADDRESS=vapid@webgl3d.dev'

    env_file:
      - services/app/.dev.vars

    restart: 'always'

  app:
    build:
      context: '.'
      dockerfile: './services/app/Dockerfile'

    container_name: 'app'

    ports:
      - '${PUSH_NOTIFICATIONS_APP_PORT:-}:3000'

    restart: 'always'

# Ensure all the services in this docker-compose file connect to the tix-factory docker network.
networks:
  default:
    name: 'tix-factory'
    external: true
