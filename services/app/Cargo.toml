[package]
name = "push-notifications-demo"
version = "2.0.0"
edition = "2021"
authors = ["Bob Rose <WebGL3D@users.noreply.github.com>"]
publish = false

[dependencies]
axum = { version = "0.8", default-features = true, features = ['json'] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
serde = { version = "1.0.229", features = ["derive"] }
p256 = "0.14.0"
base64 = "0.23.1"
time = "0.3.55"
tokio = { version = "1.53.1", features = ["full"] }
chrono = "0.4.45"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
web-push = "0.11.0"
serde_json = "1.0.151"
openssl = "0.10.81"
